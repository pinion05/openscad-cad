name: version-sync

# 버전 단일 소스 = SKILL.md 프론트매터 version 필드.
# 이 워크플로는 ① CHANGELOG/README 배지와의 일관성 검사 ② 버전 태그·릴리스 자동 생성.

on:
  push:
    branches: [main]
    paths: ['SKILL.md', 'CHANGELOG.md', 'README.md', '.github/workflows/version.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 버전 일관성 검사 (SKILL.md = CHANGELOG = README 배지)
        run: |
          set -euo pipefail
          V_SKILL=$(awk -F': *' '/^version:/{print $2; exit}' SKILL.md | tr -d ' "')
          V_CHANGELOG=$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed 's/^## //')
          V_BADGE=$(grep -m1 -oE 'version-[0-9]+\.[0-9]+\.[0-9]+-blue' README.md | sed -E 's/^version-//; s/-blue$//')
          echo "SKILL.md=$V_SKILL  CHANGELOG=$V_CHANGELOG  README배지=$V_BADGE"
          if [[ -z "$V_SKILL" || "$V_SKILL" != "$V_CHANGELOG" || "$V_SKILL" != "$V_BADGE" ]]; then
            echo "::error::버전 불일치 — 세 위치가 같은 버전을 가리켜야 합니다 (SKILL.md frontmatter / CHANGELOG 최상위 / README 배지)"
            exit 1
          fi

      - name: 버전 태그·릴리스 자동 생성 (버전 변경 시 1회)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V=$(awk -F': *' '/^version:/{print $2; exit}' SKILL.md | tr -d ' "')
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
            echo "v$V 태그가 이미 존재 — 릴리스 스킵"
            exit 0
          fi
          awk -v v="$V" 'BEGIN{p=0} $0=="## "v{p=1;next} p&&/^## [0-9]/{exit} p' CHANGELOG.md > release_body.md
          # gh release create 가 API로 태그까지 직접 생성 (git push 불가 토큰이므로)
          gh release create "v$V" --title "openscad-cad v$V" --notes-file release_body.md
          echo "릴리스 v$V 생성 완료"
